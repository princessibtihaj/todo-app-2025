  Main Salah tracker page: prayer form, priority, and task list.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salah tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header class="hero">
      <p class="hero-label">Prayer Tracker</p>
      <h3 id="active-prayer">Salah Tracker</h3>
      <p class="subtitle">Track your daily prayers by date.</p>
    </header>

    <section class="date-card">
      <button type="button" id="prev-day" class="date-nav-btn" aria-label="Previous day">&#8249;</button>
      <div class="date-meta">
        <p class="date-label">Selected Date</p>
        <p id="display-date" class="date-value"></p>
      </div>
      <button type="button" id="next-day" class="date-nav-btn" aria-label="Next day">&#8250;</button>
    </section>

    <form id="task-form" method="POST" class="task-form">
      <input type="date" id="task-date" class="task-date-input" />

      <div class="prayer-form">
        <label for="prayer-name">Salah</label>
        <select id="prayer-name" name="prayer-name" required>
          <option value="" disabled selected>Select prayer...</option>
          <option value="Fajr">Fajr</option>
          <option value="Dhuhr">Dhuhr</option>
          <option value="Asr">Asr</option>
          <option value="Maghrib">Maghrib</option>
          <option value="Isha">Isha</option>
          <option value="__other__">Other</option>
        </select>
        <input type="text" id="custom-prayer" class="custom-prayer-input" placeholder="e.g. Tahajjud, Witr" aria-label="Other prayer name" />
      </div>

      <div class="priority-section">
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="task-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <div class="priority-legend">
          <span class="priority-badge priority-low">Low</span>
          <span class="priority-badge priority-medium">Medium</span>
          <span class="priority-badge priority-high">High</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="add-task-btn">Log prayer</button>
      </div>
    </form>

    <ul id="task-list"></ul>
    <p id="empty-state" class="empty-state">No prayers logged for this date.</p>

    <p class="footer-link"><a href="{{ url_for('auth.logout') }}">Sign out</a></p>
  </div>

  <script src="{{ url_for('static', filename='todo.js') }}"></script>
</body>
</html>
