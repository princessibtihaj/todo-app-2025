<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salah tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h3>Salah tracker</h3>
    <p class="subtitle">Log and check off your daily prayers.</p>

    <form id="task-form" method="POST">
      <div class="prayer-form">
        <label for="prayer-name">Salah</label>
        <select id="prayer-name" name="prayer-name" required>
          <option value="" disabled selected>Select…</option>
          <option value="Fajr (الفجر)">Fajr — الفجر</option>
          <option value="Dhuhr (الظهر)">Dhuhr — الظهر</option>
          <option value="Asr (العصر)">Asr — العصر</option>
          <option value="Maghrib (المغرب)">Maghrib — المغرب</option>
          <option value="Isha (العشاء)">Isha — العشاء</option>
          <option value="__other__">Other (sunnah, nafl…)</option>
        </select>
        <input type="text" id="custom-prayer" class="custom-prayer-input" placeholder="e.g. Witr, Tahajjud" aria-label="Other prayer name" />
      </div>

      <div class="priority-section">
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="task-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <div class="priority-legend">
          <span class="priority-badge priority-low">Low</span>
          <span class="priority-badge priority-medium">Medium</span>
          <span class="priority-badge priority-high">High</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="add-task-btn">Log prayer</button>
      </div>
    </form>

    <ul id="task-list"></ul>

    <p class="footer-link"><a href="{{ url_for('auth.logout') }}">Sign out</a></p>
  </div>

  <script src="{{ url_for('static', filename='todo.js') }}"></script>
</body>
</html>
